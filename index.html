<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SQL Flashcards — DOMS Notes</title>
<meta name="description" content="SQL flashcards covering fundamentals through Natural Join — based on DOMS handwritten notes.">
<style>
/* ── GOOGLE FONTS ── */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

/* ── DESIGN TOKENS ── */
:root {
  --bg:       #0d1117;
  --surface:  #161b22;
  --surface2: #1e2330;
  --border:   #2a3040;
  --accent:   #58a6ff;
  --accent2:  #bc8cff;
  --green:    #3fb950;
  --red:      #f85149;
  --yellow:   #d29922;
  --text:     #e6edf3;
  --muted:    #7d8590;
  --code-bg:  #0d1117;
  --code-txt: #79c0ff;
  --radius:   10px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
header {
  padding: 18px 28px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 100;
}
.logo {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.2px;
  color: var(--accent);
  text-transform: uppercase;
  white-space: nowrap;
}
h1 {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.stats {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}

/* ── PROGRESS BAR ── */
.progress-bar-wrap {
  height: 3px;
  background: var(--surface2);
}
.progress-bar {
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  transition: width .4s ease;
  width: 0%;
}

/* ── TOOLBAR ── */
.toolbar {
  padding: 10px 28px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  background: var(--bg);
}
.cats-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  flex: 1;
}
.cat-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 500;
  padding: 4px 12px;
  cursor: pointer;
  transition: all .12s;
  font-family: inherit;
  white-space: nowrap;
}
.cat-btn:hover  { border-color: var(--accent); color: var(--accent); }
.cat-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.toolbar-right {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-shrink: 0;
}
.search-wrap { position: relative; }
#search {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 13px;
  padding: 6px 10px 6px 30px;
  font-family: inherit;
  width: 210px;
  outline: none;
  transition: border-color .12s;
}
#search:focus { border-color: var(--accent); }
#search::placeholder { color: var(--muted); }
.search-icon {
  position: absolute;
  left: 9px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
  font-size: 12px;
}
.btn-sm {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 500;
  padding: 5px 11px;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
  transition: all .12s;
}
.btn-sm:hover { border-color: var(--accent); color: var(--accent); }

/* ── GRID ── */
main { flex: 1; padding: 20px 28px 40px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 12px;
}

/* ── CARD ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color .12s, box-shadow .12s;
}
.card:hover { border-color: #3d5a8a; box-shadow: 0 4px 20px rgba(0,0,0,.3); }
.card.done  { border-color: #234d31; }
.card.done .card-front { opacity: .65; }

.card-front {
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  cursor: pointer;
  user-select: none;
}
.card-meta {
  display: flex;
  align-items: center;
  gap: 7px;
}
.card-tag {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .7px;
  text-transform: uppercase;
  color: var(--accent);
  background: rgba(88,166,255,.1);
  border-radius: 4px;
  padding: 2px 7px;
}
.card-num {
  font-size: 10px;
  color: var(--muted);
  margin-left: auto;
}
.card-q {
  font-size: 13.5px;
  line-height: 1.5;
  font-weight: 500;
  color: var(--text);
}
.card-hint {
  font-size: 10.5px;
  color: var(--muted);
  margin-top: 2px;
}
.card-hint.open-hint { color: var(--accent); }

.card-back {
  display: none;
  padding: 12px 16px 14px;
  background: var(--surface2);
  border-top: 1px solid var(--border);
  font-size: 12.5px;
  line-height: 1.65;
  color: var(--text);
}
.card.open .card-back { display: block; }

.card-back p { margin: 2px 0; }
.card-back p + p { margin-top: 1px; }

pre {
  font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 9px 12px;
  font-size: 11px;
  color: var(--code-txt);
  margin: 6px 0 4px;
  overflow-x: auto;
  line-height: 1.65;
  white-space: pre;
}
code {
  font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
  background: var(--code-bg);
  border-radius: 3px;
  padding: 1px 5px;
  font-size: 11.5px;
  color: var(--code-txt);
}

.card-actions {
  display: flex;
  gap: 7px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}
.btn-done {
  font-size: 11px; font-family: inherit; font-weight: 500;
  padding: 4px 11px; border-radius: 6px;
  border: 1px solid var(--green); background: rgba(63,185,80,.1);
  color: var(--green); cursor: pointer; transition: all .12s;
}
.btn-done:hover { background: rgba(63,185,80,.2); }
.btn-undo {
  font-size: 11px; font-family: inherit;
  padding: 4px 11px; border-radius: 6px;
  border: 1px solid var(--border); background: transparent;
  color: var(--muted); cursor: pointer; transition: all .12s;
}
.btn-undo:hover { border-color: var(--red); color: var(--red); }

/* ── EMPTY ── */
.empty {
  text-align: center;
  color: var(--muted);
  padding: 80px 0;
  font-size: 15px;
}
.empty span { display: block; font-size: 32px; margin-bottom: 12px; }

/* ── FOOTER ── */
footer {
  padding: 14px 28px;
  border-top: 1px solid var(--border);
  font-size: 11.5px;
  color: var(--muted);
  text-align: center;
}
footer a { color: var(--accent); text-decoration: none; }
footer a:hover { text-decoration: underline; }

/* ── RESPONSIVE ── */
@media (max-width: 640px) {
  header    { padding: 13px 16px; }
  h1        { font-size: 14px; }
  .toolbar  { padding: 9px 16px; }
  main      { padding: 14px 16px 32px; }
  .grid     { grid-template-columns: 1fr; gap: 10px; }
  #search   { width: 160px; }
  footer    { padding: 12px 16px; }
}
@media (max-width: 400px) {
  #search { width: 130px; }
  .toolbar-right .btn-sm { display: none; }
}
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════════
   CARDS DATA
   To add more topics later, simply append new objects to this
   array using the same format:
   { cat: "Category Name", q: "Question text", a: "Answer text" }

   For SQL code in answers, start lines with SELECT/FROM/WHERE/
   GROUP/HAVING/ORDER/INSERT/UPDATE/DELETE/CREATE/ALTER/DROP
   and they will auto-render as code blocks.
   ═══════════════════════════════════════════════════════════════ */
const CARDS = [

/* ── 1. FUNDAMENTALS ─────────────────────────────────────────── */
{ cat:"Fundamentals",
  q:"What does SQL stand for?",
  a:"Structured Query Language — a language used to communicate with or interact with a database." },

{ cat:"Fundamentals",
  q:"What is Data?",
  a:"Data is a raw fact which describes the attributes of an entity.\nRaw fact means something that is unchanged and true.\nExample: SID=01, SNAME=Moin, AGE=21, PNO=8424853802 — these are data/information." },

{ cat:"Fundamentals",
  q:"What is a Database?",
  a:"A database is a place or medium used to store data in a systematic and organized manner.\nHere, we perform operations universally referred to as CRUD operations." },

{ cat:"Fundamentals",
  q:"What are CRUD operations? Give the full form of each.",
  a:"C — Create / INSERT\nR — Retrieve / READ\nU — Update / MODIFY\nD — Delete / DROP" },

{ cat:"Fundamentals",
  q:"What is DBMS?",
  a:"DBMS (Database Management System) is software used to maintain and manage the database.\nIt provides two important features: Security & Authorisation (username & password).\nIn DBMS, data is stored in the form of files.\nTo communicate with DBMS, we use Query Language." },

{ cat:"Fundamentals",
  q:"What are the 4 types of DBMS?",
  a:"1. Hierarchical DBMS — data stored in format of roots\n2. Network DBMS — data stored in form of nodes\n3. RDBMS — data stored in form of tables\n4. Object-Oriented DBMS — data stored in form of OOPs" },

{ cat:"Fundamentals",
  q:"What is RDBMS?",
  a:"RDBMS (Relational Database Management System) is a type of DBMS software used to store the data in the form of tables.\nTo communicate with RDBMS we use Structured Query Language (SQL).\nAny type of DBMS, if they follow the Relational Model, will become RDBMS." },

{ cat:"Fundamentals",
  q:"What is the Relational Model and who created it?",
  a:"The Relational Model was designed and developed by EF. CODD.\nIt is used to store data in the form of tables.\nAny type of DBMS that follows the relational model becomes RDBMS.\n\nFlow: DBMS → Relational Model → RDBMS\n                    ↓\n               EF. CODD" },

{ cat:"Fundamentals",
  q:"What is a Table in RDBMS?",
  a:"A table is a logical organization of data which consists of rows and columns.\nA smallest unit of the table is known as a cell.\n\nColumn names are also called: Attributes / Fields\nRows are also called: Records / Tuples\n\nExample — STUDENT table:\nS-ID | S-NAME | BRANCH\n  01 |   A    |   CS\n  02 |   B    |   IT" },

{ cat:"Fundamentals",
  q:"What is Meta-Data?",
  a:"The details about the data are known as meta-data.\nThe lowest form of data is known as meta-data.\nThese meta details are stored in a 'meta-table' automatically.\n\nExample: If PHOTO column stores an image, the meta-table stores:\nPNAME='MY_PIC', SIZE=25KB, FORMAT=JPG\n\nNote: The meta details themselves are also data — this is recursive." },

/* ── 2. EF CODD'S RULES ──────────────────────────────────────── */
{ cat:"EF Codd's Rules",
  q:"State Rule 1 of EF Codd (Single Value Rule).",
  a:"Data entered into the cell must be a single value.\nStoring multiple phone numbers in one PHNO cell violates this rule (×).\n\nCorrect approach: Add columns PHNO1, PHNO2 — use NULL for missing values (✓).\nThis is the Atomic Value / First Normal Form (1NF) principle." },

{ cat:"EF Codd's Rules",
  q:"State Rule 2 of EF Codd (Multiple Tables + KEY).",
  a:"According to EF CODD, we can store data in multiple tables.\nIf required, we can establish a connection between two tables with the help of KEY attributes." },

{ cat:"EF Codd's Rules",
  q:"State Rule 3 of EF Codd (Meta-Data).",
  a:"In RDBMS, we can store the data in form of tables, including meta-data.\nMeta-data details are stored automatically in a meta-table." },

{ cat:"EF Codd's Rules",
  q:"State Rule 4 of EF Codd (Data Types & Constraints).",
  a:"Data entered into the table must be validated by assigning 'data-types' and 'constraints'.\n\nNote: Data types are mandatory; constraints are optional." },

/* ── 3. DATA TYPES ───────────────────────────────────────────── */
{ cat:"Data Types",
  q:"What is the CHAR data type? Give syntax, limit, memory behaviour and examples.",
  a:"Used to store characters: A–Z, a–z, 0–9, alphanumeric (KA-17-H2323), special chars (@, &, $…).\nCHAR values must be enclosed in single quotes: 'QSPIDER', 'NAVI MUMBAI'\n\nSyntax: CHAR(SIZE)\nMax limit: 2000 characters\nDefault size: 1\nMemory: Fixed Length Memory Allocation\n\nBecause CHAR uses fixed-length allocation, use it ONLY for fixed-length data:\n  → Pancard No., DL No., IFSC code\n\nSIZE specifies how many characters can be stored.\nExample: CHAR(10) for 'SACHIN' → 6 chars used, 4 chars wasted (memory still allocated)." },

{ cat:"Data Types",
  q:"What is the VARCHAR data type? Give syntax, limit and memory behaviour.",
  a:"Used to store characters: A–Z, a–z, 0–9, alphanumeric, special characters.\nVARCHAR values must be enclosed in single quotes.\n\nSyntax: VARCHAR(SIZE)\nMax limit: 2000 characters\nMemory: Variable Length Memory Allocation\n\nBecause VARCHAR uses variable-length allocation, use it for variable-length data:\n  → NAME, MAIL_ID, ADDRESS\n\nExample: VARCHAR(10) for 'MOIN' → only 4 chars used; unused memory is freed back (✓)" },

{ cat:"Data Types",
  q:"What is VARCHAR2?",
  a:"An updated version of VARCHAR that stores characters up to 4000 characters.\n\nSyntax: VARCHAR2(SIZE)\nMax limit: 4000 characters" },

{ cat:"Data Types",
  q:"[Interview] Difference between CHAR and VARCHAR.",
  a:"CHAR:\n1. Fixed Length Memory Allocation\n2. Syntax: CHAR(SIZE)\n3. Max: 2000 chars\n4. Example: Pancard No.\n\nVARCHAR:\n1. Variable Length Memory Allocation\n2. Syntax: VARCHAR(SIZE)\n3. Max: 2000 chars\n4. Example: Name" },

{ cat:"Data Types",
  q:"What is the DATE data type? What is its format?",
  a:"Used to store ORACLE specified date.\nDate values must be enclosed in single quotes.\n\nSyntax: DATE  (no size needed)\n\nFormat: 'DD-MON-YYYY'  OR  'DD-MON-YY'\nExample: '16-AUG-2026'  or  '16-AUG-26'" },

{ cat:"Data Types",
  q:"What is the NUMBER data type? Explain Precision and Scale with examples.",
  a:"Used to store numeric values.\n\nSyntax: NUMBER(Precision, [Scale])\n\nPrecision: number of digits required to store integer values\nScale:     number of digits to store decimal values within the precision\nDefault scale: 0\n\nExamples:\nNUMBER(5)    → ± 9 9 9 9 9          (P=5)\nNUMBER(3,0)  → ± 9 9 9             (P=3, S=0)\n\nWhen P > S:\nNUMBER(5,2)  → ± 9 9 9 . 9 9      (3 integer, 2 decimal)\nNUMBER(7,4)  → ± 9 9 9 . 9 9 9 9  (3 integer, 4 decimal)\n\nWhen P < S:\nNUMBER(2,5)  → ± . 0 0 0 9 9\nNUMBER(3,7)  → ± . 0 0 9 9 9 0 0\n\nWhen P = S:\nNUMBER(4,4)  → ± . 9 9 9 9" },

{ cat:"Data Types",
  q:"What is the CLOB data type?",
  a:"CLOB = Char Large Object.\nUsed to store characters up to 4 GB of size.\n\nSyntax: CLOB\n\nPart of the Large Object (LOB) data type family used to store huge amounts of data." },

{ cat:"Data Types",
  q:"What is the BLOB data type?",
  a:"BLOB = Binary Large Object.\nUsed to store binary values of Images, Videos, MP3 and MP4 documents up to 4 GB of size.\n\nSyntax: BLOB\n\nPart of the Large Object (LOB) data type family." },

/* ── 4. CONSTRAINTS ──────────────────────────────────────────── */
{ cat:"Constraints",
  q:"What are Constraints in SQL?",
  a:"Constraints are the rules assigned to each and every column in the table for validation purposes.\n\nTypes of Constraints:\n1. UNIQUE\n2. NOT NULL\n3. CHECK\n4. PRIMARY KEY (PK)\n5. FOREIGN KEY (FK)\n\nNote: Data types are mandatory; constraints are optional." },

{ cat:"Constraints",
  q:"What is the UNIQUE constraint?",
  a:"A constraint used to avoid duplicate or repeated values in a column.\n\nExample — ENAME column with UNIQUE:\nDuplicate names are rejected." },

{ cat:"Constraints",
  q:"What is the NOT NULL constraint?",
  a:"A constraint used to avoid NULL values in a column.\n\nNULL means the value is unknown or absent — it is not zero or empty string." },

{ cat:"Constraints",
  q:"What is the CHECK constraint?",
  a:"A constraint used for extra validation with a condition.\nIf the condition is satisfied → value is accepted.\nIf the condition is NOT satisfied → value is rejected.\n\nExample: CHECK(LEN(PHNO) = 10) → phone number must be exactly 10 digits\nExample: CHECK(SAL > 0) → salary must be positive" },

{ cat:"Constraints",
  q:"What is a Key Attribute?",
  a:"Key attributes are used to uniquely identify records in a table.\nThere can be multiple key attributes in a table." },

{ cat:"Constraints",
  q:"What is the PRIMARY KEY (PK) constraint? State its 5 characteristics.",
  a:"A constraint used to uniquely identify the records from the table.\n\nCharacteristics:\n1. Primary key CANNOT accept duplicate or repeated values\n2. Primary key CANNOT accept NULL\n3. Primary key is a combination of UNIQUE + NOT NULL\n4. In a table, we can have only ONE primary key\n5. Primary key is NOT mandatory but HIGHLY recommended" },

{ cat:"Constraints",
  q:"What is the FOREIGN KEY (FK) constraint? State its 6 characteristics.",
  a:"A constraint used to establish connection between two tables.\n\nCharacteristics:\n1. Foreign key CAN accept duplicate or repeated values\n2. It CAN accept NULL\n3. It is NOT a combination of UNIQUE & NOT NULL\n4. In a table, we can have MULTIPLE foreign keys\n5. For an attribute to become a FK, it must be a Primary Key in its own table\n6. Foreign key is also known as Referential Integrity Constraint\n\nExample: EMP table has DNO (FK) → DEPT table has DNO (PK)\n         EMP table has PAID (FK) → PRODUCT table has PID (PK)" },

{ cat:"Constraints",
  q:"[Interview] Difference between Primary Key and Foreign Key.",
  a:"PRIMARY KEY:\n1. Used to identify records uniquely from the table\n2. CANNOT accept duplicate or repeated values\n3. CANNOT accept NULL\n4. Combination of UNIQUE + NOT NULL\n5. Only ONE primary key per table\n\nFOREIGN KEY:\n1. Used to establish connection between two tables\n2. CAN accept duplicate or repeated values\n3. CAN accept NULL\n4. NOT a combination of UNIQUE + NOT NULL\n5. MULTIPLE foreign keys allowed per table" },

/* ── 5. SQL OVERVIEW ─────────────────────────────────────────── */
{ cat:"SQL Overview",
  q:"What are the 5 categories of SQL statements? Give full forms and purposes.",
  a:"1. DDL — Data Definition Language     → Create/Update/Delete TABLES\n2. DML — Data Manipulation Language  → Create/Update/Delete RECORDS\n3. TCL — Transaction Control Language → Save RECORDS\n4. DCL — Data Control Language        → GRANT/REVOKE permissions\n5. DQL — Data Query Language          → RETRIEVE/READ data" },

{ cat:"SQL Overview",
  q:"What is DQL and what are its 4 sub-statements?",
  a:"DQL (Data Query Language) — the process of retrieving the data from the database.\n\nSub-statements:\n1. SELECT — retrieve and display data\n2. PROJECTION — select only columns\n3. SELECTION — select both rows and columns\n4. JOINS — retrieve from multiple tables simultaneously" },

/* ── 6. SELECT & PROJECTION ──────────────────────────────────── */
{ cat:"SELECT & Projection",
  q:"What is PROJECTION?",
  a:"The process of retrieving the data by selecting only the columns is known as Projection.\nIn projection, all the records or values present in a particular column are by default selected." },

{ cat:"SELECT & Projection",
  q:"Write the full SELECT/PROJECTION syntax.",
  a:"SELECT  */COL-NAME [DISTINCT] /EXPRESSION [ALIAS]\nFROM    TABLE-NAME;\n\nDISTINCT and ALIAS are optional." },

{ cat:"SELECT & Projection",
  q:"What are the important notes about SELECT and FROM clause execution order?",
  a:"1. FROM clause STARTS the execution first\n2. SELECT clause executes AFTER FROM clause\n3. Order of writing: SELECT first, then FROM\n4. Order of execution: FROM first, SELECT last\n5. FROM is the ONLY clause that has permission to access the database\n6. Job of FROM: go to database, search the table, put table under execution\n7. Job of SELECT: go to table under execution, display the columns mentioned\n8. SELECT clause is responsible for preparing the Result Table\n9. Semi colon (;) represents the END of the query\n10. Asterisk (*) means select ALL columns from the table" },

{ cat:"SELECT & Projection",
  q:"What are the 3 arguments that can be passed to SELECT clause?",
  a:"1. Asterisk (*) — selects all columns\n2. Column-Name — selects specific column\n3. Expression — any statement that gives a result" },

{ cat:"SELECT & Projection",
  q:"Write queries to display all details, names only, and name+branch of all students.",
  a:"-- All details:\nSELECT *\nFROM STUDENT;\n\n-- Names only:\nSELECT SNAME\nFROM STUDENT;\n\n-- Name + Branch:\nSELECT SNAME, BRANCH\nFROM STUDENT;" },

{ cat:"SELECT & Projection",
  q:"Note: Comma in SELECT — what does it represent?",
  a:"Comma (,) is a separator between two arguments in the SELECT clause.\nExample: SELECT SNAME, BRANCH, PER  ← two commas, three columns" },

/* ── 7. DISTINCT ─────────────────────────────────────────────── */
{ cat:"DISTINCT",
  q:"What is the DISTINCT clause?",
  a:"DISTINCT is used to remove duplicate values from the result table.\n\nRules:\n• Must be used as the FIRST argument to SELECT clause\n• We can use multiple columns as arguments to DISTINCT\n• When multiple columns are selected with DISTINCT: the entire COMBINATION of values must be the same for a row to be deleted" },

{ cat:"DISTINCT",
  q:"Write a DISTINCT query and explain multi-column behavior.",
  a:"-- Single column:\nSELECT DISTINCT SNAME\nFROM STUDENT;\n\n-- Multiple columns:\nSELECT DISTINCT SNAME, BRANCH\nFROM STUDENT;\n\nNote: With multiple columns, ALL column values in the combination must match for a record to be considered a duplicate and removed." },

/* ── 8. EXPRESSION & ALIAS ───────────────────────────────────── */
{ cat:"Expression & Alias",
  q:"What is an Expression in SQL?",
  a:"Any statement which gives a result is known as an Expression.\nExpression is a combination of Operators and Operands.\n\nExample: SAL * 12  →  this is an expression\n         SAL + (SAL * 0.1)  →  also an expression" },

{ cat:"Expression & Alias",
  q:"What is an Operator and what is an Operand?",
  a:"Operator: A symbol used to perform a specific task.\nExample: *, +, -, /, =, !=, >, <\n\nOperands: Values given by users. Two types:\n1. Column-Name (e.g., SAL, ENAME)\n2. Direct Values / Literals:\n   • CHAR & DATE → case sensitive, enclosed in single quotes\n   • Numbers → no quotes needed\n\nExample: SAL * 12  →  SAL is operand (col-name), 12 is operand (literal), * is operator" },

{ cat:"Expression & Alias",
  q:"What is an ALIAS? What are the rules for alias names?",
  a:"An ALIAS is an alternative name given to a COL-NAME or EXPRESSION present in the result table.\n\nRules:\n• Can be assigned WITH or WITHOUT the 'AS' keyword\n• ALIAS name must be a SINGLE STRING — use underscore: ANNUAL_SAL\n• OR enclose in double quotes: \"ANNUAL SAL\"\n\nExample:\nSELECT ENAME, SAL*12 AS ANNUAL_SAL\nFROM EMP;" },

{ cat:"Expression & Alias",
  q:"What are the 7 types of operators in SQL?",
  a:"1. Arithmetic operators:   +, -, *, /\n2. Concatenation operator:  ||  (joins two strings)\n3. Comparison operators:    =, !=, <>\n4. Relational operators:    <, >, >=, <=\n5. Logical operators:       AND, OR, NOT\n6. Special operators:       IN, NOT IN, BETWEEN, NOT BETWEEN, IS, IS NOT, LIKE, NOT LIKE\n7. Subquery operators:      ALL, ANY, EXISTS, NOT EXISTS" },

{ cat:"Expression & Alias",
  q:"What is the Concatenation Operator (||)?",
  a:"Used to join two given strings.\n\nExample:\nSELECT ENAME || ' Working as a ' || JOB\nFROM EMP;\n\nOutput: 'SMITH Working as a CLERK'" },

{ cat:"Expression & Alias",
  q:"Write expression queries: annual salary, 10% hike, 25% deduction, total salary (SAL+COMM).",
  a:"-- Annual salary:\nSELECT ENAME, SAL*12 AS ANNUAL_SAL\nFROM EMP;\n\n-- 10% hike:\nSELECT ENAME, SAL, SAL+(SAL*0.1) AS HIKED_SAL\nFROM EMP;\n\n-- 25% deduction:\nSELECT ENAME, SAL-(SAL*2.5) AS DEDUCTED_SAL\nFROM EMP;\n\n-- Total salary (SAL + COMM):\nSELECT SAL+COMM AS TOTAL_SAL\nFROM EMP;" },

/* ── 9. WHERE CLAUSE ─────────────────────────────────────────── */
{ cat:"WHERE Clause",
  q:"What is the WHERE clause? What is SELECTION?",
  a:"SELECTION: The process of retrieving data by selecting both rows AND columns.\n\nWHERE clause is used to filter the records.\n• Executes ROW BY ROW\n• Returns output in BOOLEAN format (TRUE/FALSE)\n• Uses row filter conditions\n• Can use multiple columns with logical operators (AND, OR, NOT)\n\nSyntax:\nSELECT  */COL-NAME [DISTINCT] /EXPRESSION [ALIAS]\nFROM    TABLE-NAME\nWHERE   <ROW-FILTER-CONDITION>;" },

{ cat:"WHERE Clause",
  q:"How does WHERE clause work internally? (Execution flow)",
  a:"1. FROM clause executes → puts entire table under execution\n2. WHERE clause executes ROW BY ROW on the table\n3. Each row is checked against the condition → TRUE or FALSE\n4. Only TRUE rows pass to the next step\n5. SELECT clause executes on the filtered rows → builds Result Table\n\nExample: WHERE DNO = 20\n→ Row 1: DNO=10 → 10=20 → FALSE → excluded\n→ Row 2: DNO=20 → 20=20 → TRUE  → included ✓" },

{ cat:"WHERE Clause",
  q:"Write WHERE queries: employees in dept 20, salary > 2000, name = 'MILLER', hired on 09-JUN-1981.",
  a:"-- Employees in dept 20:\nSELECT ENAME\nFROM EMP\nWHERE DNO = 20;\n\n-- Salary > 2000:\nSELECT ENAME, SAL\nFROM EMP\nWHERE SAL > 2000;\n\n-- Name = MILLER:\nSELECT *\nFROM EMP\nWHERE ENAME = 'MILLER';\n\n-- Hired on specific date:\nSELECT ENAME, HIREDATE\nFROM EMP\nWHERE HIREDATE = '09-JUN-1981';" },

{ cat:"WHERE Clause",
  q:"Write WHERE query: employees hired AFTER 01-JAN-1981 and annual salary with ALIAS.",
  a:"-- Hired after a date:\nSELECT ENAME, HIREDATE\nFROM EMP\nWHERE HIREDATE > '01-JAN-1981';\n\n-- Annual salary > 12000 (using expression in WHERE):\nSELECT ENAME, SAL, SAL*12 AS ANNUAL_SAL\nFROM EMP\nWHERE SAL*12 > 12000;" },

/* ── 10. LOGICAL OPERATORS ───────────────────────────────────── */
{ cat:"Logical Operators",
  q:"What are Logical Operators? Name the 3 types.",
  a:"Logical operators are used to combine two or more conditions and return output based on whether those conditions are TRUE or FALSE.\n\n1. AND — both conditions must be TRUE\n2. OR  — any one condition must be TRUE\n3. NOT — rejects / reverses the result" },

{ cat:"Logical Operators",
  q:"AND operator — definition and example.",
  a:"AND operator returns TRUE only if BOTH values satisfy the conditions.\n\nExample — employees in dept 20 working as manager:\nSELECT *\nFROM EMP\nWHERE DEPTNO = 20 AND JOB = 'MANAGER';\n\nExample — salary between 1250 and 3000:\nSELECT ENAME, SAL\nFROM EMP\nWHERE SAL > 1250 AND SAL < 3000;" },

{ cat:"Logical Operators",
  q:"OR operator — definition and example.",
  a:"OR operator returns TRUE if ANY ONE of the values satisfies the condition.\n\nExample — employees in dept 10 or 20:\nSELECT *\nFROM EMP\nWHERE DEPTNO = 10 OR DEPTNO = 20;\n\nExample — working as manager or clerk:\nSELECT *\nFROM EMP\nWHERE JOB = 'MANAGER' OR JOB = 'CLERK';" },

{ cat:"Logical Operators",
  q:"NOT operator — definition and example.",
  a:"NOT is used to reject the values/records. Reverses the Boolean result.\n\nExample — employees NOT working as manager:\nSELECT *\nFROM EMP\nWHERE NOT JOB = 'MANAGER';\n\n-- Equivalent alternative:\nSELECT *\nFROM EMP\nWHERE JOB != 'MANAGER';" },

{ cat:"Logical Operators",
  q:"Write a complex AND+OR query: employees working as manager in dept 10 or 20.",
  a:"SELECT *\nFROM EMP\nWHERE JOB = 'MANAGER' AND (DEPTNO = 10 OR DEPTNO = 20);\n\nNote: Use parentheses to control operator precedence.\nAND has higher precedence than OR, so parentheses ensure OR is evaluated first." },

/* ── 11. SPECIAL OPERATORS ───────────────────────────────────── */
{ cat:"Special Operators",
  q:"What is the IN operator? Give syntax and example.",
  a:"A multi-valued operator that can accept multiple values at the RHS.\nReturns TRUE if ANY ONE of the values is satisfied.\n\nSyntax: COL-NAME/EXPRESSION  IN (V1, V2, V3, ..., Vn)\n\nExample:\nSELECT *\nFROM EMP\nWHERE DEPTNO IN (10, 20, 30);\n\nExample with strings:\nSELECT ENAME, JOB\nFROM EMP\nWHERE JOB IN ('SALESMAN', 'MANAGER', 'CLERK');" },

{ cat:"Special Operators",
  q:"What is the NOT IN operator? Give syntax and example.",
  a:"Similar to IN operator. Instead of selecting the values, it REJECTS them.\n\nSyntax: COL-NAME/EXPRESSION  NOT IN (V1, V2, V3, ..., Vn)\n\nExample:\nSELECT ENAME, DEPTNO\nFROM EMP\nWHERE DEPTNO NOT IN (10, 40);\n\nExample — not clerk or manager in dept 20:\nSELECT *\nFROM EMP\nWHERE DEPTNO = 20\n  AND JOB NOT IN ('CLERK', 'MANAGER');" },

{ cat:"Special Operators",
  q:"What is the BETWEEN operator? State its 3 rules.",
  a:"Used whenever there is a RANGE of values.\n\nSyntax: COL-NAME/EXPRESSION  BETWEEN  LOWER-RANGE  AND  HIGHER-RANGE\n\n3 Rules:\n1. BETWEEN includes the range boundaries (≥ lower AND ≤ higher)\n2. We CANNOT interchange the range (lower must come first)\n3. Works with numbers, dates, and characters\n\nExample:\nSELECT *\nFROM EMP\nWHERE SAL BETWEEN 1000 AND 3000;\n\nDate example:\nSELECT ENAME, HIREDATE\nFROM EMP\nWHERE HIREDATE BETWEEN '01-JAN-1982' AND '31-DEC-1984';" },

{ cat:"Special Operators",
  q:"What is the NOT BETWEEN operator?",
  a:"Similar to BETWEEN but instead of selecting the range, it REJECTS the range of values.\n\nSyntax: COL-NAME/EXPRESSION  NOT BETWEEN  LOWER-RANGE  AND  HIGHER-RANGE\n\nExample:\nSELECT ENAME, SAL\nFROM EMP\nWHERE SAL NOT BETWEEN 1250 AND 3000;\n\nCombined example — salary in range 1500-3000 AND NOT hired 1985-1990:\nSELECT *\nFROM EMP\nWHERE SAL BETWEEN 1500 AND 3000\n  AND HIREDATE NOT BETWEEN '01-JAN-1986' AND '31-DEC-1989';" },

{ cat:"Special Operators",
  q:"What is the IS operator? Syntax and example.",
  a:"Used to compare ONLY with NULL (you cannot use = for NULL comparison).\n\nSyntax: COL-NAME/EXPRESSION  IS NULL\n\nExample — employees not getting commission:\nSELECT ENAME, COMM\nFROM EMP\nWHERE COMM IS NULL;\n\nExample — employee with no reporting manager:\nSELECT ENAME\nFROM EMP\nWHERE MGR IS NULL;" },

{ cat:"Special Operators",
  q:"What is the IS NOT operator? Syntax and example.",
  a:"Used to compare the value with NOT NULL.\n\nSyntax: COL-NAME/EXPRESSION  IS NOT NULL\n\nExample — employees getting commission:\nSELECT ENAME, COMM\nFROM EMP\nWHERE COMM IS NOT NULL;\n\nExample — employees with salary but no commission:\nSELECT *\nFROM EMP\nWHERE SAL IS NOT NULL AND COMM IS NULL;" },

{ cat:"Special Operators",
  q:"What is the LIKE operator? What are its two special characters?",
  a:"LIKE operator is used to achieve PATTERN MATCHING.\n\nSyntax: COL-NAME/EXPRESSION  LIKE  'PATTERN-MATCHING'\n\nTwo special characters:\n① %  (Percentile): accepts any character, any number of times (even 0 times)\n②  _  (Underscore): accepts any character but ONLY ONE time\n\nPattern summary table:\nStarting  | Ending | Start+End | Anywhere | Underscore\n  'A%'   | '%A'   | 'A%.S'    | '%A%'    | '_L%'" },

{ cat:"Special Operators",
  q:"LIKE: What does % (percentile) mean? Give 6 pattern examples.",
  a:"% accepts any character, any number of times (including zero characters).\n\nExamples:\n'A%'    — starts with A\n'%A'    — ends with A\n'A%S'   — starts with A, ends with S\n'%A%'   — A appears anywhere in name\n'%NOV%' — contains NOV (hired in November)\n'%.81'  — date ends with 81 (hired in year 1981)" },

{ cat:"Special Operators",
  q:"LIKE: What does _ (underscore) mean? Give 5 pattern examples.",
  a:"_ accepts any character but ONLY ONE time.\n\nExamples:\n'_L%'    — 2nd character is L\n'__A%'   — 3rd character is A\n'___L%'  — 4th character is L\n'____'   — name has EXACTLY 4 characters\n'_C%.T'  — 2nd char is C, ends with T\n\nFor numbers:\n'2%'     — salary starts with 2\n'---'    — salary has exactly 3 digits" },

{ cat:"Special Operators",
  q:"What is the NOT LIKE operator?",
  a:"Similar to LIKE operator. Instead of selecting the pattern, it REJECTS the pattern matching.\n\nSyntax: COL-NAME/EXPRESSION  NOT LIKE  'PATTERN-MATCHING'" },

{ cat:"Special Operators",
  q:"Write LIKE queries: name starts with A and ends with S; exactly 4 chars; 4th char is L.",
  a:"-- Starts with A and ends with S:\nSELECT *\nFROM EMP\nWHERE ENAME LIKE 'A%' AND ENAME LIKE '%.S';\n\n-- Exactly 4 characters:\nSELECT *\nFROM EMP\nWHERE ENAME LIKE '____';\n\n-- 4th character is L:\nSELECT *\nFROM EMP\nWHERE ENAME LIKE '___L%';\n\n-- Hired in November:\nSELECT *\nFROM EMP\nWHERE HIREDATE LIKE '%NOV%';" },

/* ── 12. FUNCTIONS ───────────────────────────────────────────── */
{ cat:"Functions",
  q:"What are Functions in SQL? What are the components of a function?",
  a:"Functions are blocks of code or lists of instructions used to perform a specific task.\n\nComponents of a function:\n1. Function-Name\n2. Number of arguments\n3. Return Type\n\nTwo main types:\n1. In-Built Functions (In SQL)\n   a. Single Row Functions (SRF)\n   b. Multi Row Functions (MRF)\n2. User-Defined Functions" },

{ cat:"Functions",
  q:"What is a Single Row Function (SRF)? How does it process data?",
  a:"A single row function executes ROW BY ROW.\n\nProcess:\n• Takes one input → processes it → generates one output → takes next input\n• If you pass N inputs → returns N outputs\n\nDiagram: 1 i/p → [Process] → 1 o/p\n          2 i/p → [Process] → 2 o/p\n          3 i/p → [Process] → 3 o/p" },

{ cat:"Functions",
  q:"What is a Multi Row Function (MRF)? How does it process data?",
  a:"A multi row function executes GROUP BY GROUP.\n\nProcess:\n• Takes ALL inputs at one shot → executes → provides a SINGLE output\n• If you pass N inputs → returns 1 output\n\nDiagram: 1 i/p ↘\n          2 i/p → [Process] → 1 o/p\n          3 i/p ↗\n\nList of MRFs: MAX(), MIN(), SUM(), AVG(), COUNT()" },

{ cat:"Functions",
  q:"What are the 5 Multi Row Functions and what does each return?",
  a:"1. MAX()   — returns the maximum value in a column\n2. MIN()   — returns the minimum value in a column\n3. SUM()   — returns the sum of all values in a column\n4. AVG()   — returns the average of all values in a column\n5. COUNT() — returns the count of non-null records" },

{ cat:"Functions",
  q:"State the 5 important rules for Multi Row Functions (MRF).",
  a:"1. MRF accepts only ONE argument: COL-NAME or EXPRESSION\n   Syntax: MRF(COL-NAME/EXP)\n\n2. Along with MRF(), we should NOT use any other column-name in the SELECT clause\n   (Except the GROUP BY column)\n\n3. MRF() IGNORES NULL values\n\n4. We CANNOT use MRF() in the WHERE clause\n   (Use HAVING clause for group-level filtering)\n\n5. COUNT() is the only MRF that can accept * as an argument:\n   SELECT COUNT(*) FROM EMP;" },

{ cat:"Functions",
  q:"Write MRF queries: max salary, min salary, total salary, avg salary, count of employees.",
  a:"SELECT MAX(SAL)   FROM EMP;\nSELECT MIN(SAL)   FROM EMP;\nSELECT SUM(SAL)   FROM EMP;\nSELECT AVG(SAL)   FROM EMP;\nSELECT COUNT(*)   FROM EMP;\n\n-- Multiple MRFs in one query:\nSELECT AVG(SAL), SUM(SAL), COUNT(*), MAX(SAL)\nFROM EMP\nWHERE JOB = 'PRESIDENT';" },

/* ── 13. GROUP BY ────────────────────────────────────────────── */
{ cat:"GROUP BY",
  q:"What is GROUP BY clause? State its key rules.",
  a:"GROUP BY is used to GROUP the records.\n\nKey rules:\n• Executes ROW-BY-ROW; after execution we get groups\n• Any clause that executes AFTER GROUP BY must execute GROUP BY GROUP\n• The COL-NAME/EXPRESSION used in GROUP BY can be used in SELECT clause\n• GROUP BY can be used WITHOUT WHERE clause\n\nSyntax:\nSELECT  GROUP_BY_COL, GROUP_FUNCTION\nFROM    TABLE-NAME\nWHERE   <ROW-FILTER-CONDITION>    (optional)\nGROUP BY COL-NAME/EXPRESSION;" },

{ cat:"GROUP BY",
  q:"Write GROUP BY queries: employees per dept; max salary per dept; employees per job.",
  a:"-- Number of employees in each dept:\nSELECT COUNT(*), DNO\nFROM EMP\nGROUP BY DNO;\n\n-- Maximum salary per dept:\nSELECT DEPTNO, MAX(SAL)\nFROM EMP\nGROUP BY DEPTNO;\n\n-- Employees per job:\nSELECT JOB, COUNT(*)\nFROM EMP\nGROUP BY JOB;\n\n-- Total salary per job:\nSELECT JOB, SUM(SAL)\nFROM EMP\nGROUP BY JOB;" },

{ cat:"GROUP BY",
  q:"Write a GROUP BY + WHERE query: avg salary per dept excluding dept 20.",
  a:"SELECT DEPTNO, AVG(SAL)\nFROM EMP\nWHERE DEPTNO != 20\nGROUP BY DEPTNO;" },

{ cat:"GROUP BY",
  q:"Write a GROUP BY query: number of times each salary is repeated.",
  a:"SELECT SAL, COUNT(*)\nFROM EMP\nGROUP BY SAL;" },

/* ── 14. HAVING ──────────────────────────────────────────────── */
{ cat:"HAVING",
  q:"What is the HAVING clause? State its key rules.",
  a:"HAVING is used to FILTER THE GROUPS.\n\nKey rules:\n• Executes GROUP BY GROUP\n• In HAVING clause, we use GROUP FILTER CONDITIONS\n• HAVING must be used AFTER GROUP BY clause\n• In HAVING clause, we CAN use Multi Row Functions (MRFs)\n\nSyntax:\nSELECT  GROUP_BY_COL, GROUP_FUNCTION\nFROM    TABLE-NAME\nWHERE   <ROW-FILTER-CONDITION>       (optional)\nGROUP BY COL-NAME/EXPRESSION\nHAVING  <GROUP-FILTER-CONDITION>;" },

{ cat:"HAVING",
  q:"Write HAVING queries: depts with ≥3 employees; jobs with total salary > 3450.",
  a:"-- Depts with at least 3 employees (salary ≠ 6000):\nSELECT COUNT(*), DNO\nFROM EMP\nWHERE SAL != 6000\nGROUP BY DNO\nHAVING COUNT(*) >= 3;\n\n-- Jobs with total salary > 3450:\nSELECT JOB, SUM(SAL)\nFROM EMP\nGROUP BY JOB\nHAVING SUM(SAL) > 3450;\n\n-- Depts with ≥4 employees:\nSELECT DEPTNO, SUM(SAL)\nFROM EMP\nGROUP BY DEPTNO\nHAVING COUNT(*) >= 4;\n\n-- Salaries repeated exactly twice:\nSELECT SAL, COUNT(*)\nFROM EMP\nGROUP BY SAL\nHAVING COUNT(*) = 2;" },

{ cat:"HAVING",
  q:"Write HAVING query: job and max salary if max salary exceeds 2600.",
  a:"SELECT JOB, MAX(SAL)\nFROM EMP\nGROUP BY JOB\nHAVING MAX(SAL) > 2600;" },

{ cat:"HAVING",
  q:"[Interview] Difference between WHERE and HAVING clause.",
  a:"WHERE:\n1. Filters the RECORDS (rows)\n2. Executes ROW-BY-ROW\n3. Must be executed BEFORE GROUP BY clause\n4. CANNOT use Multi Row Functions (MRF)\n\nHAVING:\n1. Filters the GROUPS\n2. Executes GROUP-BY-GROUP\n3. Must be executed AFTER GROUP BY clause\n4. CAN use Multi Row Functions (MRF)" },

/* ── 15. SUB-QUERY ───────────────────────────────────────────── */
{ cat:"Sub-Query",
  q:"What is a Sub-Query / Inner Query?",
  a:"A query written INSIDE another query is known as a Sub-Query (also called Inner Query).\n\nWorking principle:\n1. Inner query executes FIRST and produces output\n2. The output of inner query is given as INPUT to the outer query\n3. The outer query generates the final result\n\nTherefore: the outer query is DEPENDENT on the inner query.\n\nDiagram:\nOuter Query → [gets input from] → Inner Query\n     ↑                                  |\n   Result                             Output" },

{ cat:"Sub-Query",
  q:"Case 1: When do we use a Sub-Query? (Unknown/indirect condition)",
  a:"Case 1: Whenever there are UNKNOWN or INDIRECT conditions, we use a sub-query.\n\nExample — employees earning more salary than Miller:\nSELECT ENAME\nFROM EMP\nWHERE SAL > (SELECT SAL\n             FROM EMP\n             WHERE ENAME = 'MILLER');\n\nExample — employees earning less than Blake:\nSELECT ENAME\nFROM EMP\nWHERE SAL < (SELECT SAL\n             FROM EMP\n             WHERE ENAME = 'BLAKE');" },

{ cat:"Sub-Query",
  q:"Case 2: When do we use a Sub-Query? (Data from 2 different tables)",
  a:"Case 2: Whenever data to be SELECTED and the condition to be EXECUTED are present in 2 different tables, we use a sub-query.\n\nExample — dept name of James (data: DEPT, condition on: EMP):\nSELECT DNAME\nFROM DEPT\nWHERE DNO = (SELECT DNO\n             FROM EMP\n             WHERE ENAME = 'JAMES');\n\nExample — location of Adam:\nSELECT LOC\nFROM DEPT\nWHERE DEPTNO = (SELECT DEPTNO\n               FROM EMP\n               WHERE ENAME = 'ADAM');" },

{ cat:"Sub-Query",
  q:"What are the 2 types of Sub-Queries?",
  a:"1. SINGLE ROW SUB-QUERY:\n   → Inner query returns exactly ONE value\n   → Can use normal operators (=, >, <, >=, <=, !=) to compare\n   → Can also use special operators\n\n2. MULTI ROW SUB-QUERY:\n   → Inner query returns MORE THAN ONE value\n   → CANNOT use normal operators\n   → Must use ONLY special operators: IN, NOT IN, ALL, ANY\n\nNote: It is RECOMMENDED to always use special operators since it is difficult to identify whether a sub-query is single or multi-row." },

{ cat:"Sub-Query",
  q:"What is a Nested Sub-Query? State its key facts.",
  a:"A sub-query written inside another sub-query is known as a Nested Sub-Query.\n\nKey facts:\n• We can nest nearly 255 sub-queries\n• The INNER-MOST sub-query executes first\n• Used to find Nth Minimum and Nth Maximum salary/hiredate\n\nLogic:\n  → To find Nth Max: use nested MAX with SAL < ... (go lower each level)\n  → To find Nth Min: use nested MIN with SAL > ... (go higher each level)\n\nExample — 4th maximum salary:\nSELECT ENAME, SAL FROM EMP\nWHERE SAL = (SELECT MAX(SAL) FROM EMP\n  WHERE SAL < (SELECT MAX(SAL) FROM EMP\n    WHERE SAL < (SELECT MAX(SAL) FROM EMP\n      WHERE SAL < (SELECT MAX(SAL) FROM EMP))));" },

{ cat:"Sub-Query",
  q:"What is the ALL sub-query operator? How does it work?",
  a:"ALL is a sub-query/special operator used with relational operators (>, <, >=, <=) to compare values at the RHS.\n\nALL returns TRUE only if ALL the values at RHS satisfy the condition.\n\nLogic: SAL > ALL (2000, 4000, 5000)\n  → SAL > 2000 AND SAL > 4000 AND SAL > 5000\n  → TRUE only if SAL > 5000 (the maximum)\n\nExample — employees earning more than ALL employees in dept 20:\nSELECT ENAME\nFROM EMP\nWHERE SAL > ALL (SELECT SAL\n                 FROM EMP\n                 WHERE DNO = 20);" },

{ cat:"Sub-Query",
  q:"What is the ANY sub-query operator? How does it work?",
  a:"ANY is a sub-query/special operator used with relational operators (>, <, >=, <=) to compare values at the RHS.\n\nANY returns TRUE if ANY ONE of the values at RHS satisfies the condition.\n\nLogic: SAL < ANY (2000, 4000, 5000)\n  → SAL < 2000 OR SAL < 4000 OR SAL < 5000\n  → TRUE if SAL < 5000 (the maximum)\n\nExample — employees earning less than at least one salesman:\nSELECT ENAME, SAL\nFROM EMP\nWHERE SAL < ANY (SELECT SAL\n                 FROM EMP\n                 WHERE JOB = 'SALESMAN');\n\nNote: Always use special operators — difficult to determine single/multi-row upfront." },

{ cat:"Sub-Query",
  q:"EMP–MGR Relationship — Case 1: Find Manager. Write a query to find Allen's manager's name.",
  a:"The EMP table has a MGR column that stores the EMPNO of the manager.\n\nCase 1 — Find the MANAGER of an employee:\nSELECT ENAME\nFROM EMP\nWHERE ENO = (SELECT MGR\n             FROM EMP\n             WHERE ENAME = 'ALLEN');\n\n-- Find Blake's manager's manager:\nSELECT ENAME\nFROM EMP\nWHERE ENO = (SELECT MGR\n             FROM EMP\n             WHERE ENO = (SELECT MGR\n                          FROM EMP\n                          WHERE ENAME = 'BLAKE'));" },

{ cat:"Sub-Query",
  q:"EMP–MGR Relationship — Case 2: Find Employees reporting to a manager.",
  a:"Case 2 — Find EMPLOYEES reporting to a given manager:\nSELECT ENAME\nFROM EMP\nWHERE MGR = (SELECT ENO\n             FROM EMP\n             WHERE ENAME = 'BLAKE');\n\n-- Count of employees reporting to King:\nSELECT COUNT(*)\nFROM EMP\nWHERE MGR = (SELECT EMPNO\n             FROM EMP\n             WHERE ENAME = 'KING');\n\n-- Employees reporting to Ford's manager:\nSELECT COUNT(*)\nFROM EMP\nWHERE MGR = (SELECT MGR\n             FROM EMP\n             WHERE ENAME = 'FORD');" },

{ cat:"Sub-Query",
  q:"Write complex sub-queries: employees in same dept as Smith; same designation as James; employees in accounting dept.",
  a:"-- Same dept as Smith:\nSELECT ENAME, DEPTNO\nFROM EMP\nWHERE DEPTNO = (SELECT DEPTNO\n               FROM EMP\n               WHERE ENAME = 'SMITH');\n\n-- Same designation as James:\nSELECT *\nFROM EMP\nWHERE JOB = (SELECT JOB\n             FROM EMP\n             WHERE ENAME = 'JAMES');\n\n-- Manager working in accounting dept:\nSELECT ENAME\nFROM EMP\nWHERE JOB = 'MANAGER'\n  AND DEPTNO = (SELECT DEPTNO\n               FROM DEPT\n               WHERE DNAME = 'ACCOUNTING');" },

/* ── 16. JOINS ───────────────────────────────────────────────── */
{ cat:"Joins",
  q:"What are JOINS? When do we use them? What are the 5 types?",
  a:"JOINS: The process of retrieving data from MULTIPLE TABLES simultaneously.\n\nWhen to use: Whenever attributes are to be selected from BOTH tables.\n\n5 Types:\n1. Cross / Cartesian Join\n2. Inner / Equi Join\n3. Natural Join\n4. Outer Join\n   a. Left Outer Join\n   b. Right Outer Join\n   c. Full Outer Join\n5. Self Join" },

{ cat:"Joins",
  q:"What is Cross / Cartesian Join? Give syntax (Oracle and ANSI) and result formula.",
  a:"A record from table 1 will MERGE with ALL the records of table 2.\n\nOracle syntax:\nSELECT */COL-NAME/EXPRESSION\nFROM TABLE1, TABLE2;\n\nANSI syntax:\nSELECT */COL-NAME/EXPRESSION\nFROM TABLE1 CROSS JOIN TABLE2;\n\nExample:\nSELECT *\nFROM EMP, DEPT;\n\nResult formulas:\n• No. of columns = T1 columns + T2 columns  (2+2=4)\n• No. of records = T1 records × T2 records  (3×3=9)" },

{ cat:"Joins",
  q:"What is Inner Join / Equi Join? Give syntax (Oracle and ANSI) and join condition format.",
  a:"Used to obtain ONLY THE MATCHING records from two tables.\nJoin Conditions are MANDATORY.\n\nOracle syntax:\nSELECT */COL-NAME/EXPRESSION\nFROM TABLE1, TABLE2\nWHERE <JOIN CONDITIONS>;\n\nANSI syntax:\nSELECT */COL-NAME/EXPRESSION\nFROM TABLE1 INNER JOIN TABLE2\nON <JOIN CONDITIONS>;\n\nJoin Condition format:\nTABLE1.COL-NAME = TABLE2.COL-NAME\n\nExample:\nSELECT *\nFROM EMP, DEPT\nWHERE EMP.DEPTNO = DEPT.DEPTNO;" },

{ cat:"Joins",
  q:"Write Inner Join queries: ENAME + DNAME; ENAME + SAL + DNAME + LOC; managers in each dept.",
  a:"-- Employee name and department name:\nSELECT ENAME, DNAME\nFROM EMP, DEPT\nWHERE EMP.DEPTNO = DEPT.DEPTNO;\n\n-- Name, salary, dept name, location:\nSELECT ENAME, SAL, DNAME, LOC\nFROM EMP, DEPT\nWHERE EMP.DEPTNO = DEPT.DEPTNO;\n\n-- Managers only:\nSELECT ENAME, DNAME\nFROM EMP, DEPT\nWHERE EMP.DEPTNO = DEPT.DEPTNO\n  AND JOB = 'MANAGER';\n\n-- Annual salary > 2340 with dept name:\nSELECT DNAME, SAL*12 AS ANNUAL_SAL\nFROM EMP, DEPT\nWHERE EMP.DEPTNO = DEPT.DEPTNO\n  AND SAL > 2340;" },

{ cat:"Joins",
  q:"What is Natural Join? Explain its two behaviours with examples.",
  a:"Natural Join has TWO behaviours depending on the tables:\n\nBehaviour 1 — If there IS a connection (common column) between tables:\n→ Natural Join behaves like INNER JOIN\n→ The common column appears ONLY ONCE in result (unlike inner join where it appears twice)\n\nBehaviour 2 — If there is NO connection between tables:\n→ Natural Join behaves like CROSS JOIN\n\nSyntax:\nSELECT */COL-NAME/EXPRESSION\nFROM TABLE1 NATURAL JOIN TABLE2;\n\nCase 1 — EMP & DEPT (common: DNO):\nSELECT * FROM EMP NATURAL JOIN DEPT;\nResult: DNO | ENAME | DNAME  (DNO appears once)\n\nCase 2 — EMP & STUDENT (no common column):\nSELECT * FROM EMP NATURAL JOIN STUDENT;\nResult: Cross product (3×3 = 9 rows)" },

{ cat:"Joins",
  q:"Difference between Inner Join and Natural Join result tables.",
  a:"INNER JOIN result (EMP.DEPTNO = DEPT.DNO):\nENAME | EMP.DNO | DEPT.DNO | DNAME\n  A   |   20    |    20    |  D2\n  B   |   30    |    30    |  D3\n→ DNO column appears TWICE\n\nNATURAL JOIN result (same tables):\nDNO | ENAME | DNAME\n 20 |   A   |  D2\n 30 |   B   |  D3\n→ DNO column appears only ONCE (merged)" },

{ cat:"Joins",
  q:"What are the 3 types of Outer Join?",
  a:"Outer Join returns matching + non-matching records.\n\n1. LEFT OUTER JOIN:\n   Returns ALL records from LEFT table + matching records from RIGHT table\n   Unmatched right-side columns filled with NULL\n\n2. RIGHT OUTER JOIN:\n   Returns ALL records from RIGHT table + matching records from LEFT table\n   Unmatched left-side columns filled with NULL\n\n3. FULL OUTER JOIN:\n   Returns ALL records from BOTH tables (matched + unmatched)\n   NULL filled wherever no match exists" },

{ cat:"Joins",
  q:"Write Inner Join queries combining with sub-queries: dept of employees in sales; employees in New York.",
  a:"-- Employees in sales dept:\nSELECT *\nFROM EMP\nWHERE DEPTNO = (SELECT DEPTNO\n               FROM DEPT\n               WHERE DNAME = 'SALES');\n\n-- Employees working in New York:\nSELECT *\nFROM EMP\nWHERE DEPTNO = (SELECT DEPTNO\n               FROM DEPT\n               WHERE LOC = 'NEW YORK');\n\n-- DNAME + LOC for employees whose name ends with R:\nSELECT DNAME, LOC, DEPTNO\nFROM DEPT\nWHERE DEPTNO IN (SELECT DEPTNO\n                 FROM EMP\n                 WHERE ENAME LIKE '%.R');" },

/* ── 17. QUERY PATTERNS (PRACTICE) ──────────────────────────── */
{ cat:"Query Patterns",
  q:"Pattern: Display all details of a table.",
  a:"SELECT *\nFROM STUDENT;\n\nSELECT *\nFROM EMP;" },

{ cat:"Query Patterns",
  q:"Pattern: Display specific columns.",
  a:"SELECT SNAME, BRANCH\nFROM STUDENT;\n\nSELECT ENAME, JOB, SAL\nFROM EMP;" },

{ cat:"Query Patterns",
  q:"Pattern: Filter by job, salary range, and date range.",
  a:"-- Clerks:\nSELECT ENAME FROM EMP WHERE JOB = 'CLERK';\n\n-- Salary 1250-3000:\nSELECT ENAME, SAL FROM EMP\nWHERE SAL > 1250 AND SAL < 3000;\n\n-- Hired 1981-1985:\nSELECT ENAME, HIREDATE FROM EMP\nWHERE HIREDATE > '31-DEC-1981'\n  AND HIREDATE < '01-JAN-1985';\n\n-- Annual salary > 12000:\nSELECT ENAME, SAL*12 AS ANNUAL_SAL FROM EMP\nWHERE SAL*12 > 12000;" },

{ cat:"Query Patterns",
  q:"Pattern: Complex AND+OR conditions (bracket usage).",
  a:"-- Analyst or Salesman in dept 10 or 30 with salary > 1800:\nSELECT *\nFROM EMP\nWHERE (JOB = 'ANALYST' OR JOB = 'SALESMAN')\n  AND (DEPTNO = 10 OR DEPTNO = 30)\n  AND SAL > 1800;\n\n-- Clerk in dept 10, 20, or 30:\nSELECT ENAME, DEPTNO, JOB\nFROM EMP\nWHERE JOB = 'CLERK'\n  AND (DEPTNO = 10 OR DEPTNO = 20 OR DEPTNO = 30);" },

{ cat:"Query Patterns",
  q:"Pattern: Using IN + NOT IN + BETWEEN together.",
  a:"-- IN:\nSELECT * FROM EMP WHERE DEPTNO IN (10, 20, 30);\n\n-- NOT IN:\nSELECT * FROM EMP WHERE DEPTNO NOT IN (10, 40);\n\n-- BETWEEN:\nSELECT * FROM EMP WHERE SAL BETWEEN 1000 AND 3000;\n\n-- Salary in range AND not hired between 1985-1990:\nSELECT *\nFROM EMP\nWHERE SAL BETWEEN 1500 AND 3000\n  AND HIREDATE NOT BETWEEN '01-JAN-1986' AND '31-DEC-1989';" },

{ cat:"Query Patterns",
  q:"Pattern: IS NULL and IS NOT NULL queries.",
  a:"-- No commission:\nSELECT ENAME, COMM FROM EMP WHERE COMM IS NULL;\n\n-- Getting commission:\nSELECT ENAME, COMM FROM EMP WHERE COMM IS NOT NULL;\n\n-- Getting salary but not commission:\nSELECT * FROM EMP WHERE SAL IS NOT NULL AND COMM IS NULL;\n\n-- No reporting manager (President):\nSELECT ENAME FROM EMP WHERE MGR IS NULL;" },

{ cat:"Query Patterns",
  q:"Pattern: Common LIKE pattern queries.",
  a:"-- Name starts with A:\nSELECT * FROM EMP WHERE ENAME LIKE 'A%';\n\n-- Name ends with S:\nSELECT * FROM EMP WHERE ENAME LIKE '%.S';\n\n-- Name starts with A AND ends with S:\nSELECT * FROM EMP WHERE ENAME LIKE 'A%' AND ENAME LIKE '%.S';\n\n-- Exactly 4 characters:\nSELECT * FROM EMP WHERE ENAME LIKE '____';\n\n-- Hired in year 81:\nSELECT * FROM EMP WHERE HIREDATE LIKE '%.81';\n\n-- 3-digit salary:\nSELECT * FROM EMP WHERE SAL LIKE '---';\n\n-- Hired in NOV:\nSELECT * FROM EMP WHERE HIREDATE LIKE '%NOV%';" },

{ cat:"Query Patterns",
  q:"Pattern: GROUP BY with HAVING — common exam questions.",
  a:"-- Count per dept:\nSELECT DNO, COUNT(*) FROM EMP GROUP BY DNO;\n\n-- Depts with ≥3 employees:\nSELECT DNO, COUNT(*) FROM EMP\nGROUP BY DNO HAVING COUNT(*) >= 3;\n\n-- Total salary per job > 3450:\nSELECT JOB, SUM(SAL) FROM EMP\nGROUP BY JOB HAVING SUM(SAL) > 3450;\n\n-- Max salary per job > 2600:\nSELECT JOB, MAX(SAL) FROM EMP\nGROUP BY JOB HAVING MAX(SAL) > 2600;\n\n-- Jobs with count ≥2 clerks in each dept:\nSELECT DEPTNO, COUNT(*) FROM EMP\nWHERE JOB = 'CLERK'\nGROUP BY DEPTNO HAVING COUNT(*) >= 2;" },

{ cat:"Query Patterns",
  q:"Pattern: Sub-query with MRF — max salary, min hiredate, max commission.",
  a:"-- Employee with max salary:\nSELECT ENAME FROM EMP\nWHERE SAL = (SELECT MAX(SAL) FROM EMP);\n\n-- Employee hired first:\nSELECT ENAME, HIREDATE FROM EMP\nWHERE HIREDATE = (SELECT MIN(HIREDATE) FROM EMP);\n\n-- Employee with max commission:\nSELECT ENAME, SAL, COMM FROM EMP\nWHERE COMM = (SELECT MAX(COMM) FROM EMP);\n\n-- Employee with least EMPNO:\nSELECT * FROM EMP\nWHERE EMPNO = (SELECT MIN(EMPNO) FROM EMP);\n\n-- Least annual salary:\nSELECT * FROM EMP\nWHERE SAL*12 = (SELECT MIN(SAL*12) FROM EMP);" },

{ cat:"Query Patterns",
  q:"Pattern: Inner Join with conditions across EMP and DEPT.",
  a:"-- Name and location of all employees:\nSELECT ENAME, LOC FROM EMP, DEPT\nWHERE EMP.DEPTNO = DEPT.DEPTNO;\n\n-- Accounting dept employees and salary:\nSELECT DNAME, SAL FROM EMP, DEPT\nWHERE EMP.DEPTNO = DEPT.DEPTNO\n  AND DNAME = 'ACCOUNTING';\n\n-- Employees with 'A' in name, with dept name:\nSELECT ENAME, DNAME FROM EMP, DEPT\nWHERE EMP.DEPTNO = DEPT.DEPTNO\n  AND DNAME LIKE '%.A.%';\n\n-- Employees hired after 1983 in Accounting or Research:\nSELECT DNAME, HIREDATE FROM EMP, DEPT\nWHERE EMP.DEPTNO = DEPT.DEPTNO\n  AND HIREDATE > '31-DEC-1983'\n  AND DNAME IN ('ACCOUNTING', 'RESEARCH');"  },

{ cat:"Query Patterns",
  q:"Pattern: ALL and ANY sub-query operators.",
  a:"-- Employees earning more than ALL managers:\nSELECT ENAME FROM EMP\nWHERE SAL > ALL (SELECT SAL FROM EMP WHERE JOB = 'MANAGER');\n\n-- Employees hired after ALL clerks:\nSELECT * FROM EMP\nWHERE HIREDATE > ALL (SELECT HIREDATE FROM EMP WHERE JOB = 'CLERK');\n\n-- Employees earning less than at least one salesman:\nSELECT ENAME, SAL FROM EMP\nWHERE SAL < ANY (SELECT SAL FROM EMP WHERE JOB = 'SALESMAN');\n\n-- Annual salary more than all salesmen:\nSELECT ENAME, SAL*12 FROM EMP\nWHERE SAL*12 > ALL (SELECT SAL*12 FROM EMP WHERE JOB = 'SALESMAN');" },

/* ── 18. CROSS JOIN DETAILS ──────────────────────────────────── */
{ cat:"Joins",
  q:"Cross Join: How many rows and columns does the result table have? Prove with example.",
  a:"Given: EMP (3 rows, 2 cols: ENAME, DNO) and DEPT (3 rows, 2 cols: DNO, DNAME)\n\nResult columns = T1 cols + T2 cols = 2 + 2 = 4 columns\nResult records = T1 rows × T2 rows = 3 × 3 = 9 records\n\nResult table (EMP CROSS JOIN DEPT):\nENAME | DNO | DNO | DNAME\n  A   |  20 |  10 |  D1\n  A   |  20 |  20 |  D2\n  A   |  20 |  30 |  D3\n  B   |  30 |  10 |  D1\n  B   |  30 |  20 |  D2\n  B   |  30 |  30 |  D3\n  C   |  10 |  10 |  D1\n  C   |  10 |  20 |  D2\n  C   |  10 |  30 |  D3\n\nNote: Every row of EMP is merged with every row of DEPT." },

/* ── 19. NATURAL JOIN CASE 2 DETAIL ─────────────────────────── */
{ cat:"Joins",
  q:"Natural Join Case 2 — EMP and STUDENT (no common column). What is the result?",
  a:"When there is NO common column between two tables, Natural Join behaves like CROSS JOIN.\n\nGiven:\nEMP:     ENAME | DNO  (3 rows: A/10, B/20, C/30)\nSTUDENT: SID   | SNAME (3 rows: 101/X, 102/Y, 103/Z)\n\nSELECT *\nFROM EMP NATURAL JOIN STUDENT;\n\nResult (9 rows — all 4 columns):\nENAME | DNO | SID | SNAME\n  A   |  10 | 101 |   X\n  A   |  10 | 102 |   Y\n  A   |  10 | 103 |   Z\n  B   |  20 | 101 |   X\n  B   |  20 | 102 |   Y\n  B   |  20 | 103 |   Z\n  C   |  30 | 101 |   X\n  C   |  30 | 102 |   Y\n  C   |  30 | 103 |   Z" },

/* ── 20. SUBQUERY RULES & TYPES SUMMARY ─────────────────────── */
{ cat:"Sub-Query",
  q:"What are the rules and differences between Single Row and Multi Row sub-queries?",
  a:"SINGLE ROW SUB-QUERY:\n• Inner query returns EXACTLY ONE value\n• Can use normal operators: =, >, <, >=, <=, !=\n• Can also use special operators: IN, NOT IN, ALL, ANY\nExample:\nWHERE SAL = (SELECT MAX(SAL) FROM EMP)\n\nMULTI ROW SUB-QUERY:\n• Inner query returns MORE THAN ONE value\n• CANNOT use normal operators (= cannot compare one value to many)\n• Must use ONLY special operators: IN, NOT IN, ALL, ANY\nExample:\nWHERE DEPTNO IN (SELECT DEPTNO FROM EMP WHERE ENAME LIKE 'A%')\n\nBest Practice: Always use special operators because it is difficult to identify whether a query will be single or multi-row at the time of writing." },

{ cat:"Sub-Query",
  q:"Write nested sub-query: 2nd maximum salary.",
  a:"SELECT ENAME, SAL\nFROM EMP\nWHERE SAL = (SELECT MAX(SAL)\n             FROM EMP\n             WHERE SAL < (SELECT MAX(SAL)\n                          FROM EMP));\n\nNote:\n• Innermost executes first → finds overall MAX\n• Middle query finds MAX below that\n• Outer query finds employee matching that salary\n\nPattern for Nth Max: nest N-1 levels of 'SAL < MAX(SAL)'\nPattern for Nth Min: nest N-1 levels of 'SAL > MIN(SAL)'" },

{ cat:"Sub-Query",
  q:"Write sub-query: employees hired before SCOTT; employees working in SAME dept as SCOTT in RESEARCH.",
  a:"-- Hired before SCOTT:\nSELECT ENAME, HIREDATE\nFROM EMP\nWHERE HIREDATE < (SELECT HIREDATE\n                  FROM EMP\n                  WHERE ENAME = 'SCOTT');\n\n-- Same dept as SCOTT AND dept is RESEARCH:\nSELECT *\nFROM EMP\nWHERE DEPTNO = (SELECT DEPTNO\n               FROM EMP\n               WHERE ENAME = 'SCOTT')\n  AND DEPTNO = (SELECT DEPTNO\n               FROM DEPT\n               WHERE DNAME = 'RESEARCH');" },

/* ── 21. LIKE OPERATOR — EXAM TRICKY PATTERNS ────────────────── */
{ cat:"Special Operators",
  q:"LIKE pattern: employees hired in November 1983; last 2 digits of salary are 50; hired in DEC or MAY.",
  a:"-- Hired in November 1983:\nSELECT *\nFROM EMP\nWHERE HIREDATE LIKE '%.NOV-83';\n\n-- Salary's last 2 digits are 50:\nSELECT *\nFROM EMP\nWHERE SAL LIKE '%.50';\n\n-- Hired in DEC or MAY:\nSELECT *\nFROM EMP\nWHERE HIREDATE LIKE '%.DEC%'\n   OR HIREDATE LIKE '%.MAY%';\n\n-- Hired in year 81:\nSELECT *\nFROM EMP\nWHERE HIREDATE LIKE '%.81';\n\n-- Name has 'C' as second letter and ends with 'T':\nSELECT *\nFROM EMP\nWHERE ENAME LIKE '_C%.T';" },

/* ── 22. MRF PRACTICE QUERIES ────────────────────────────────── */
{ cat:"Functions",
  q:"Write MRF queries combining with WHERE and GROUP BY: count employees per job with 'A'; total salary for clerks hired in FEB.",
  a:"-- Count employees per job with char 'A' in name:\nSELECT JOB, COUNT(*)\nFROM EMP\nWHERE ENAME LIKE '%.A.%'\nGROUP BY JOB;\n\n-- Total salary for clerks:\nSELECT SUM(SAL)\nFROM EMP\nWHERE JOB = 'CLERK';\n\n-- Total salary for employees hired in FEB:\nSELECT SUM(SAL)\nFROM EMP\nWHERE HIREDATE LIKE '%.FEB%';\n\n-- Avg, sum, count, max for presidents:\nSELECT AVG(SAL), SUM(SAL), COUNT(*), MAX(SAL)\nFROM EMP\nWHERE JOB = 'PRESIDENT';\n\n-- No. of employees getting commission in dept 30:\nSELECT COUNT(*)\nFROM EMP\nWHERE COMM IS NOT NULL\n  AND DEPTNO = 30;" },

/* ── 23. HAVING COMPLEX QUERIES ──────────────────────────────── */
{ cat:"HAVING",
  q:"Write HAVING queries: depts with avg salary < 3000; depts with ≥3 employees named with A or S; min & max salary per job if min>1000 and max<5000.",
  a:"-- AVG salary < 3000 per dept:\nSELECT AVG(SAL), DEPTNO\nFROM EMP\nGROUP BY SAL\nHAVING AVG(SAL) < 3000;\n\n-- Dept with ≥3 employees with A or S in name:\nSELECT DEPTNO, COUNT(*)\nFROM EMP\nWHERE ENAME LIKE '%.A.%'\n   OR ENAME LIKE '%.S.%'\nGROUP BY DEPTNO\nHAVING COUNT(*) >= 3;\n\n-- Min and max salary per job (min>1000 AND max<5000):\nSELECT JOB, MIN(SAL), MAX(SAL)\nFROM EMP\nGROUP BY JOB\nHAVING MIN(SAL) >= 1000\n   AND MAX(SAL) < 5000;\n\n-- Managers in depts with exactly 2 managers:\nSELECT DEPTNO, COUNT(*)\nFROM EMP\nWHERE JOB = 'MANAGER'\nGROUP BY DEPTNO\nHAVING COUNT(*) = 2;" },

/* ── 24. INNER JOIN — TRICKY MULTI-CONDITION ─────────────────── */
{ cat:"Joins",
  q:"Write Inner Join queries: employees with 'A' in name and their dept name; employees in MILLER's designation + NEWYORK dept.",
  a:"-- Employees with 'A' in name + dept name:\nSELECT ENAME, DNAME\nFROM EMP, DEPT\nWHERE EMP.DEPTNO = DEPT.DEPTNO\n  AND DNAME LIKE '%.A.%';\n\n-- Same designation as MILLER AND working in NEWYORK dept:\nSELECT *\nFROM EMP\nWHERE JOB = (SELECT JOB\n             FROM EMP\n             WHERE ENAME = 'MILLER')\n  AND DEPTNO = (SELECT DEPTNO\n               FROM DEPT\n               WHERE LOC = 'NEWYORK');\n\n-- Employees in OPERATIONS dept hired before KING:\nSELECT ENAME, SAL, JOB, HIREDATE\nFROM EMP, DEPT\nWHERE EMP.DEPTNO = DEPT.DEPTNO\n  AND DNAME = 'OPERATIONS'\n  AND HIREDATE < (SELECT HIREDATE\n                 FROM EMP\n                 WHERE ENAME = 'KING');" },

/* ── 25. EXPRESSION — SALARY COMPUTATION PATTERNS ───────────── */
{ cat:"Expression & Alias",
  q:"Write expression queries: employee details + annual bonus 2000; name + salary + 10% annual hike; name + salary with deduction of 100 penalty.",
  a:"-- All details + annual bonus 2000:\nSELECT EMP.*, (SAL*12)+2000 AS TOTAL_SAL\nFROM EMP;\n\n-- Name, salary, 10% annual hike:\nSELECT ENAME, SAL, SAL+(SAL*0.1) AS HIKED_SAL\nFROM EMP;\n\n-- Name, salary with monthly hike of 50:\nSELECT ENAME, SAL+50 AS HIKED_SAL\nFROM EMP;\n\n-- Name, salary with penalty of 100:\nSELECT ENAME, JOB, SAL-100 AS SAL_WITH_PENALTY\nFROM EMP;\n\n-- Name, annual salary with 10% annual deduction:\nSELECT ENAME, (SAL*12) - ((SAL*12)*0.1) AS DEDUCTED_ANNUAL\nFROM EMP;\n\n-- Total compensation (SAL + COMM) as alias:\nSELECT SAL+COMM AS TOTAL_SAL\nFROM EMP;" },

/* ── 26. KEY TERMS QUICK REFERENCE ──────────────────────────── */
{ cat:"Fundamentals",
  q:"Quick Reference: What are synonyms for Row, Column, and Table in relational databases?",
  a:"ROW = Record = Tuple\nCOLUMN = Attribute = Field\nTABLE = Entity = Relation\n\nCELL = smallest unit of a table\n\nMETA-DATA = data about the data (lowest form of data)\nMETA-TABLE = table that automatically stores meta-data\n\nNULL = unknown / absent value (not zero, not empty string)" },

{ cat:"Fundamentals",
  q:"Quick Reference: What is the full form of CRUD and which SQL language maps to each?",
  a:"C — Create   → DML: INSERT\nR — Retrieve → DQL: SELECT\nU — Update   → DML: UPDATE\nD — Delete   → DML: DELETE (records) or DDL: DROP (tables)\n\nFull SQL language categories:\nDDL — Data DEFINITION Language   (Tables: CREATE, ALTER, DROP)\nDML — Data MANIPULATION Language (Records: INSERT, UPDATE, DELETE)\nDQL — Data QUERY Language        (Read: SELECT)\nTCL — Transaction CONTROL Language (Save: COMMIT, ROLLBACK)\nDCL — Data CONTROL Language      (Permissions: GRANT, REVOKE)" },

/* ── 27. INTERVIEW QUESTIONS SUMMARY ─────────────────────────── */
{ cat:"EF Codd's Rules",
  q:"Summary: What are all 4 rules of EF Codd covered in notes?",
  a:"Rule 1 — Atomic Value Rule:\nData entered into a cell must be a SINGLE VALUE (no multiple values in one cell).\n\nRule 2 — Multiple Tables + KEY Rule:\nData can be stored in multiple tables; connection established using KEY attributes.\n\nRule 3 — Meta-Data Rule:\nRDBMS must store data in tables INCLUDING meta-data (in a meta-table automatically).\n\nRule 4 — Data Type + Constraint Rule:\nData entered into the table must be validated by assigning data-types (mandatory) and constraints (optional)." },

{ cat:"Data Types",
  q:"Summary: All 6 data types covered — syntax, limit and key characteristic.",
  a:"1. CHAR(SIZE)       → max 2000 chars  → Fixed length memory\n2. VARCHAR(SIZE)     → max 2000 chars  → Variable length memory\n3. VARCHAR2(SIZE)    → max 4000 chars  → Updated VARCHAR\n4. DATE              → no size         → 'DD-MON-YYYY' format\n5. NUMBER(P,[S])     → precision/scale → integer + decimal\n6. CLOB              → up to 4 GB     → character large object\n   BLOB              → up to 4 GB     → binary large object (images, video)" },

{ cat:"Constraints",
  q:"Summary: All 5 constraints — purpose, NULL allowed, duplicates allowed.",
  a:"Constraint    | Purpose                        | NULL? | Duplicates?\n──────────────┼────────────────────────────────┼───────┼────────────\nUNIQUE        | Prevent duplicate values       | Yes   | No\nNOT NULL      | Prevent NULL values            | No    | Yes\nCHECK         | Validate with condition        | Yes   | Yes\nPRIMARY KEY   | Uniquely identify each record  | No    | No\nFOREIGN KEY   | Link two tables via key        | Yes   | Yes\n\nPrimary Key = UNIQUE + NOT NULL\nForeign Key must be PK in its own table (Referential Integrity)" },

{ cat:"Special Operators",
  q:"Summary: All 8 special operators — purpose and syntax.",
  a:"1. IN           → COL IN (v1,v2,v3)            → matches any of the listed values\n2. NOT IN        → COL NOT IN (v1,v2,v3)        → rejects any of the listed values\n3. BETWEEN       → COL BETWEEN low AND high      → inclusive range\n4. NOT BETWEEN   → COL NOT BETWEEN low AND high  → outside the range\n5. IS            → COL IS NULL                   → compare with NULL only\n6. IS NOT        → COL IS NOT NULL               → compare with NOT NULL\n7. LIKE          → COL LIKE 'pattern'            → pattern matching (% and _)\n8. NOT LIKE      → COL NOT LIKE 'pattern'        → reject the pattern\n\nKey: LIKE wildcards:\n  %  → any character, any number of times (0 or more)\n  _  → any character, exactly ONE time" },

{ cat:"Joins",
  q:"Summary: All join types — what they return.",
  a:"1. CROSS JOIN (Cartesian):\n   Every row of T1 merges with every row of T2\n   Rows = T1×T2  |  Cols = T1+T2\n\n2. INNER JOIN (Equi Join):\n   Only MATCHING rows from both tables\n   Requires join condition: T1.col = T2.col\n\n3. NATURAL JOIN:\n   • Common column exists → behaves like INNER JOIN (col appears once)\n   • No common column   → behaves like CROSS JOIN\n\n4. LEFT OUTER JOIN:\n   All rows from LEFT + matching from RIGHT (NULL for no match)\n\n5. RIGHT OUTER JOIN:\n   All rows from RIGHT + matching from LEFT (NULL for no match)\n\n6. FULL OUTER JOIN:\n   All rows from BOTH tables (NULL where no match)\n\n7. SELF JOIN:\n   Table joined with itself (used for EMP-MGR relationship)" },

{ cat:"Sub-Query",
  q:"Summary: Sub-query operators ALL vs ANY — truth condition comparison.",
  a:"ALL operator:\n• Returns TRUE if ALL values at RHS satisfy the condition\n• SAL > ALL(2000,4000,5000) → TRUE only if SAL > 5000 (the MAX)\n• 'Greater than ALL' = greater than the maximum\n• 'Less than ALL'    = less than the minimum\n\nANY operator:\n• Returns TRUE if ANY ONE value at RHS satisfies the condition\n• SAL > ANY(2000,4000,5000) → TRUE if SAL > 2000 (the MIN)\n• 'Greater than ANY' = greater than the minimum\n• 'Less than ANY'    = less than the maximum\n\nMemory trick:\n  ALL → compare against WORST CASE (maximum for >, minimum for <)\n  ANY → compare against BEST CASE  (minimum for >, maximum for <)" },

/* ── OUTER JOIN ──────────────────────────────────────────────── */
{ cat:"Outer Join",
  q:"What is Outer Join? What does it return?",
  a:"Outer Join is used to obtain BOTH matching AND unmatching records.\n\n3 types:\ni)  Left Outer Join\nii) Right Outer Join\niii) Full Outer Join" },

{ cat:"Outer Join",
  q:"What is Left Outer Join? Give Oracle and ANSI syntax.",
  a:"Used to obtain UNMATCHED records of the LEFT table along with the MATCHING records.\n\nOracle syntax:\nSELECT */COL-NAME/EXPRESSION\nFROM TABLE1, TABLE2\nWHERE TABLE1.COL-NAME = TABLE2.COL-NAME (+);\n\nANSI syntax:\nSELECT */COL-NAME/EXPRESSION\nFROM TABLE1 LEFT JOIN TABLE2\nON TABLE1.COL-NAME = TABLE2.COL-NAME;\n\nNote: (+) goes on the RIGHT side in Oracle for Left Outer Join." },

{ cat:"Outer Join",
  q:"Show the result table of Left Outer Join with example (EMP left join DEPT).",
  a:"EMP table:            DEPT table:\nENAME | DNO           DNO | DNAME\n  A   |  10           10 |  D1\n  B   | NULL          20 |  D2\n  C   |  30           30 |  D3\n  D   | NULL          40 |  D4\n\nSELECT *\nFROM EMP, DEPT\nWHERE EMP.DNO = DEPT.DNO (+);\n\nResult Table:\nENAME | DNO  | DNO  | DNAME\n  A   |  10  |  10  |  D1     ← Matching\n  C   |  30  |  30  |  D3     ← Matching\n  B   | NULL | NULL | NULL    ← Unmatched from LEFT (EMP)\n  D   | NULL | NULL | NULL    ← Unmatched from LEFT (EMP)" },

{ cat:"Outer Join",
  q:"What is Right Outer Join? Give Oracle and ANSI syntax.",
  a:"Used to obtain UNMATCHED records of the RIGHT table along with the MATCHING records.\n\nOracle syntax:\nSELECT */COL-NAME/EXPRESSION\nFROM TABLE1, TABLE2\nWHERE TABLE1.COL-NAME (+) = TABLE2.COL-NAME;\n\nANSI syntax:\nSELECT */COL-NAME/EXPRESSION\nFROM TABLE1 RIGHT OUTER JOIN TABLE2\nON TABLE1.COL-NAME = TABLE2.COL-NAME;\n\nNote: (+) goes on the LEFT side in Oracle for Right Outer Join." },

{ cat:"Outer Join",
  q:"Show the result table of Right Outer Join with example (EMP right join DEPT).",
  a:"SELECT *\nFROM EMP, DEPT\nWHERE EMP.DNO (+) = DEPT.DNO;\n\nResult Table:\nENAME | DNO  | DNO  | DNAME\n  A   |  10  |  10  |  D1     ← Matching\n  C   |  30  |  30  |  D3     ← Matching\n NULL | NULL |  20  |  D2     ← Unmatched from RIGHT (DEPT)\n NULL | NULL |  40  |  D4     ← Unmatched from RIGHT (DEPT)" },

{ cat:"Outer Join",
  q:"What is Full Outer Join? Give ANSI syntax and show result table.",
  a:"Used to obtain UNMATCHED records from BOTH LEFT and RIGHT tables along with the MATCHING records.\n\nANSI syntax only (no Oracle (+) shorthand for FULL):\nSELECT */COL-NAME/EXPRESSION\nFROM TABLE1 FULL OUTER JOIN TABLE2\nON TABLE1.COL-NAME = TABLE2.COL-NAME;\n\nExample:\nSELECT *\nFROM EMP FULL OUTER JOIN DEPT\nON EMP.DNO = DEPT.DNO;\n\nResult Table:\nENAME | DNO  | DNO  | DNAME\n  A   |  10  |  10  |  D1     ← Matching\n  C   |  30  |  30  |  D3     ← Matching\n  B   | NULL | NULL | NULL    ← Unmatched from LEFT\n  D   | NULL | NULL | NULL    ← Unmatched from LEFT\n NULL | NULL |  20  |  D2     ← Unmatched from RIGHT\n NULL | NULL |  40  |  D4     ← Unmatched from RIGHT" },

{ cat:"Outer Join",
  q:"[Interview] Where does (+) go in Oracle syntax for Left vs Right Outer Join?",
  a:"Left Outer Join  → (+) goes on the RIGHT side:\n  WHERE TABLE1.COL = TABLE2.COL (+)\n  (We want all of TABLE1 — put (+) on the side that can be NULL)\n\nRight Outer Join → (+) goes on the LEFT side:\n  WHERE TABLE1.COL (+) = TABLE2.COL\n  (We want all of TABLE2 — put (+) on the side that can be NULL)\n\nMemory trick: (+) goes on the OPPOSITE side of the table you want ALL records from." },

{ cat:"Self Join",

{ cat:"Self Join",

{ cat:"Self Join",

/* ── SINGLE ROW FUNCTIONS — LIST ─────────────────────────────── */
{ cat:"Single Row Functions",
  q:"What are the 16 Single Row Functions listed in the notes?",
  a:"1.  LENGTH()         — count characters in a string\n2.  CONCAT()         — join two strings\n3.  UPPER()          — convert to uppercase\n4.  LOWER()          — convert to lowercase\n5.  INITCAP()        — initial capital (title case)\n6.  REVERSE()        — reverse a string\n7.  SUBSTR()         — extract part of a string  [IMP]\n8.  INSTR()          — find position of string    [IMP]\n9.  REPLACE()        — replace string with another\n10. MOD()            — modulus/remainder\n11. TRUNC()          — truncate number to lower value\n12. ROUND()          — round-off a number\n13. MONTHS_BETWEEN() — months between two dates\n14. LAST_DAY()       — last day of a month\n15. TO_CHAR()        — convert date to string format\n16. NVL()            — NULL value logic             [IMP]\n\nNote: All are Single Row Functions — execute row by row, N inputs → N outputs." },

/* ── SUBSTR ───────────────────────────────────────────────────── */
{ cat:"Single Row Functions",
  q:"What is SUBSTR()? [IMP] Give syntax, notes, and examples with BANGALORE.",
  a:"Used to EXTRACT a part of a string from the given original string.\n\nSyntax: SUBSTR('original-string', Position, [LENGTH])\n\nNote: LENGTH is NOT mandatory.\nIf length is not mentioned, consider the complete remaining string.\n\nPositive positions (left to right): B=1, A=2, N=3, G=4, A=5, L=6, O=7, R=8, E=9\nNegative positions (right to left): B=-9, A=-8, N=-7, G=-6, A=-5, L=-4, O=-3, R=-2, E=-1\n\nSUBSTR('BANGALORE', 1, 4) → BANG\nSUBSTR('BANGALORE', 4, 4) → GALO\nSUBSTR('BANGALORE', 5, 1) → A\nSUBSTR('BANGALORE', -6, 3) → GAL\nSUBSTR('BANGALORE', 7, 7) → ORE\nSUBSTR('BANGALORE', 5)    → ALORE\n\nTable queries:\nSELECT ENAME, SUBSTR(ENAME, 1, 3)\nFROM EMP;\n-- First 3 characters\n\nSELECT ENAME, SUBSTR(ENAME, -3)\nFROM EMP;\n-- Last 3 characters\n\nSELECT ENAME\nFROM EMP\nWHERE SUBSTR(ENAME, 1, 1) = 'A';\n-- Names starting with A (using SRF)" },

/* ── REPLACE ─────────────────────────────────────────────────── */
{ cat:"Single Row Functions",
  q:"What is REPLACE()? Give syntax, note, and examples.",
  a:"Used to REPLACE a string with another string in the original string.\n\nSyntax: REPLACE('original-string', 'string', ['new-string'])\n\nNote: If the third argument is not mentioned, the default value is NULL (i.e., the matched string is deleted).\n\nExamples with 'BANGALORE':\nREPLACE('BANGALORE','B','M')   → MAGALORE\nREPLACE('BANGALORE','A','N')   → BNNGNLORE\nREPLACE('BANGALORE','G','K')   → BANKALORE\nREPLACE('BANGALORE','A','ALO') → BALOGALOLORE\nREPLACE('BANGALORE','A')       → BNGLORE  (A deleted — no 3rd arg)\n\nTrick query — count occurrences of 'A' in 'MALAYALAM':\nSELECT LENGTH('MALAYALAM') - LENGTH(REPLACE('MALAYALAM','A'))\nFROM DUAL;\n→ 9 - 6 = 3 occurrences of 'A'\n\nFind employees with character 'A' exactly twice:\nSELECT ENAME\nFROM EMP\nWHERE LENGTH(ENAME) - LENGTH(REPLACE(ENAME,'A')) = 2;" },

/* ── INSTR ───────────────────────────────────────────────────── */
{ cat:"Single Row Functions",
  q:"What is INSTR()? [IMP] Give syntax, note, and examples with MALAYALAM.",
  a:"Used to SEARCH for a string in the original string.\nIf present → returns the POSITION.\nIf not present → returns 0.\n\nSyntax: INSTR('Original_String', 'String', Position, [Occurrence])\n\nNote: If occurrence is not mentioned, the default value is 1.\n\nMALAYALAM positions: M=1, A=2, L=3, A=4, Y=5, A=6, L=7, A=8, M=9\n\nINSTR('MALAYALAM','A', 1, 1) → 2   (1st A from position 1)\nINSTR('MALAYALAM','A', 1, 3) → 6   (3rd A from position 1)\nINSTR('MALAYALAM','A', 1, 5) → 0   (5th A doesn't exist)\nINSTR('MALAYALAM','A', 2, 1) → 2   (1st A from position 2)\nINSTR('MALAYALAM','A', 3, 2) → 6   (2nd A from position 3)\nINSTR('MALAYALAM','A', 6, 1) → 6   (1st A from position 6)\nINSTR('MALAYALAM','A', 4)    → 4   (1st A from position 4)\n\nQuery — employees with 'A' in name (using INSTR):\nSELECT ENAME\nFROM EMP\nWHERE INSTR(ENAME, 'A', 1, 1) > 0;" },

/* ── MOD ─────────────────────────────────────────────────────── */
{ cat:"Single Row Functions",

/* ── ROUND ───────────────────────────────────────────────────── */
{ cat:"Single Row Functions",

/* ── TRUNC ───────────────────────────────────────────────────── */
{ cat:"Single Row Functions",

{ cat:"Date Functions",

{ cat:"Single Row Functions",

{ cat:"ORDER BY",

{ cat:"ORDER BY",
