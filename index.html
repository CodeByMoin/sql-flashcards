/* ═══════════════════════════════════════════════════════════════
   APP LOGIC — no need to edit below when adding cards
   ═══════════════════════════════════════════════════════════════ */
const STORAGE_KEY = 'sql_fc_done_v1';
let done = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
let activeCategory = 'All';
let searchTerm = '';
let openCards = new Set();

function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...done])); } catch(e){}
}

function getCategories() {
  const seen = new Set();
  const cats = ['All'];
  CARDS.forEach(c => { if (!seen.has(c.cat)) { seen.add(c.cat); cats.push(c.cat); } });
  return cats;
}

function getVisible() {
  return CARDS.filter((c, i) => {
    const catOk = activeCategory === 'All' || c.cat === activeCategory;
    const sq = searchTerm.toLowerCase();
    const searchOk = !sq || c.q.toLowerCase().includes(sq) || c.a.toLowerCase().includes(sq) || c.cat.toLowerCase().includes(sq);
    return catOk && searchOk;
  });
}

function renderCats() {
  const el = document.getElementById('catsRow');
  el.innerHTML = getCategories().map(cat => {
    const count = cat === 'All' ? CARDS.length : CARDS.filter(c => c.cat === cat).length;
    return `<button class="cat-btn${cat === activeCategory ? ' active' : ''}"
      onclick="setCategory(${JSON.stringify(cat)})">${cat} <span style="opacity:.6">(${count})</span></button>`;
  }).join('');
}

function setCategory(cat) {
  activeCategory = cat;
  renderCats();
  renderGrid();
}

function updateStats() {
  const visible = getVisible();
  const doneCount = visible.filter(c => done.has(CARDS.indexOf(c))).length;
  document.getElementById('statsEl').textContent = `${doneCount} / ${visible.length} done`;
  const pct = visible.length ? (doneCount / visible.length * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function formatAnswer(raw) {
  const lines = raw.split('\n');
  let html = '';
  let codeBuf = [];
  let inCode = false;

  const SQL_KW = /^\s*(SELECT|FROM|WHERE|GROUP\s+BY|HAVING|ORDER\s+BY|INSERT|UPDATE|DELETE|CREATE|ALTER|DROP|COMMIT|ROLLBACK|GRANT|REVOKE|--\s)/i;
  const INDENT = /^\s{2,}/;

  function flushCode() {
    if (codeBuf.length) {
      html += '<pre>' + codeBuf.join('\n') + '</pre>';
      codeBuf = [];
    }
    inCode = false;
  }

  lines.forEach((line, i) => {
    const isSQL = SQL_KW.test(line) || (inCode && INDENT.test(line) && line.trim());
    if (isSQL) {
      inCode = true;
      codeBuf.push(escHtml(line));
    } else {
      flushCode();
      const t = escHtml(line).replace(/`([^`]+)`/g, '<code>$1</code>');
      html += t.trim()
        ? `<p style="margin:2px 0">${t}</p>`
        : `<p style="margin:5px 0"></p>`;
    }
  });
  flushCode();
  return html;
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyMsg');
  const visible = getVisible();

  if (!visible.length) {
    grid.innerHTML = '';
    empty.style.display = '';
    updateStats();
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = visible.map(card => {
    const idx = CARDS.indexOf(card);
    const isDone = done.has(idx);
    const isOpen = openCards.has(idx);
    return `<div class="card${isDone ? ' done' : ''}${isOpen ? ' open' : ''}" id="card-${idx}">
      <div class="card-front" onclick="toggleCard(${idx})">
        <div class="card-meta">
          <span class="card-tag">${escHtml(card.cat)}</span>
          <span class="card-num">#${idx + 1}</span>
        </div>
        <div class="card-q">${escHtml(card.q)}</div>
        <div class="card-hint${isOpen ? ' open-hint' : ''}">${isOpen ? '▲ Click to collapse' : '▼ Click to reveal →'}</div>
      </div>
      <div class="card-back">
        ${formatAnswer(card.a)}
        <div class="card-actions">
          <button class="btn-done" onclick="markDone(${idx},event)">${isDone ? '✓ Marked Done' : '✓ Mark Done'}</button>
          ${isDone ? `<button class="btn-undo" onclick="markUndone(${idx},event)">↩ Undo</button>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  updateStats();
}

function toggleCard(idx) {
  if (openCards.has(idx)) openCards.delete(idx);
  else openCards.add(idx);
  renderGrid();
}

function markDone(idx, e) {
  e.stopPropagation();
  done.add(idx);
  persist();
  renderGrid();
}

function markUndone(idx, e) {
  e.stopPropagation();
  done.delete(idx);
  persist();
  renderGrid();
}

function expandAll() {
  getVisible().forEach(c => openCards.add(CARDS.indexOf(c)));
  renderGrid();
}

function collapseAll() {
  openCards.clear();
  renderGrid();
}

function resetAll() {
  if (confirm('Reset all progress?')) {
    done.clear();
    persist();
    renderGrid();
  }
}

document.getElementById('search').addEventListener('input', function() {
  searchTerm = this.value.trim();
  renderGrid();
});

// Keyboard shortcut: press / to focus search
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== document.getElementById('search')) {
    e.preventDefault();
    document.getElementById('search').focus();
  }
});

// Init
renderCats();
renderGrid();
</script>
</body>
</html>
